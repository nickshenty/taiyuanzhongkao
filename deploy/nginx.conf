# 太原中考志愿咨询系统 - Nginx 站点配置
#
# 用法：
#   1. 复制到 /etc/nginx/sites-available/taiyuan-zhongkao
#   2. ln -s /etc/nginx/sites-available/taiyuan-zhongkao /etc/nginx/sites-enabled/
#   3. 把 zk.example.com 换成你的域名，webroot 换成实际路径
#   4. nginx -t && systemctl reload nginx
#   5. HTTPS：certbot --nginx -d zk.example.com （自动改写本文件并配置续期）
#
# 同域部署：前端静态文件与 /api 反代在同一站点，
# 因此前端构建时无需设置 VITE_API_BASE，走相对路径 /api 即可。

# 后端上游（Node 服务由 PM2 管理，监听回环地址）
upstream taiyuan_api {
    server 127.0.0.1:3002;
    keepalive 32;
}

# HTTP：仅用于 ACME 校验与跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zk.example.com;

    # Let's Encrypt 续期校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zk.example.com;

    # ---------- 证书（certbot 会自动填好这些行）----------
    ssl_certificate     /etc/letsencrypt/live/zk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zk.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---------- 前端静态资源 ----------
    root /var/www/taiyuan-zhongkao;
    index index.html;

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://taiyuan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 与后端 BODY_LIMIT 保持一致
        client_max_body_size 256k;
    }

    # 接口文档页（后端渲染的 HTML）
    location = /docs {
        proxy_pass http://taiyuan_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（可供负载均衡/监控探活，不对外暴露细节）
    location = /health {
        proxy_pass http://taiyuan_api/health;
        access_log off;
    }

    # 隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
